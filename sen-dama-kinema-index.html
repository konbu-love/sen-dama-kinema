<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>蛇玉キネマ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; min-height: 100%;
    background: #080808; color: #eee;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  }
  body {
    min-height: 100svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 18px 10px 28px; overflow: hidden;
  }
  #theater {
    position: relative; width: min(94vw, 640px);
    aspect-ratio: 4 / 3; background: #111;
    border: 8px solid #000; border-radius: 10px;
    box-shadow: 0 0 34px #222, inset 0 0 24px #000;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse, transparent 48%, #000 100%);
  }
  #controls {
    height: 76px; display: flex; align-items: center; justify-content: center;
  }
  button {
    min-width: 190px; padding: 12px 30px;
    color: #eee; background: #151515; border: 1px solid #ddd;
    outline: 2px solid #555; outline-offset: 3px;
    font: 22px "Yu Mincho", "Hiragino Mincho ProN", serif;
    letter-spacing: .35em; text-indent: .35em;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); background: #333; }
  button[hidden] { display: none; }
  .note { color: #777; font: 11px sans-serif; margin-top: 2px; }
</style>
</head>
<body>
  <main id="theater" aria-label="蛇玉キネマ">
    <canvas id="screen" width="800" height="600"></canvas>
    <div id="vignette"></div>
  </main>
  <div id="controls">
    <button id="action" type="button" hidden>着火</button>
  </div>
  <div class="note">画面内の演出です。実際の火薬は使用しません。</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const button = document.getElementById("action");

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = 468;

  const STATE = {
    TITLE: "title",
    READY: "ready",
    IGNITING: "igniting",
    GROWING: "growing",
    FINISH: "finish"
  };

  let state = STATE.TITLE;
  let stateFrame = 0;
  let frame = 0;
  let segments = [];
  let particles = [];
  let targetLength = 0;
  let angle = -Math.PI / 2;
  let angularVelocity = 0;
  let seed = Math.random() * 1000;
  let finishWait = 0;

  // 画面全体に重ねるフィルム粒子。色成分はすべて同じ値＝完全なグレースケール。
  const grain = document.createElement("canvas");
  grain.width = 256;
  grain.height = 256;
  const grainCtx = grain.getContext("2d");
  const grainImage = grainCtx.createImageData(256, 256);
  for (let i = 0; i < grainImage.data.length; i += 4) {
    const value = Math.floor(Math.random() * 256);
    grainImage.data[i] = value;
    grainImage.data[i + 1] = value;
    grainImage.data[i + 2] = value;
    grainImage.data[i + 3] = 30;
  }
  grainCtx.putImageData(grainImage, 0, 0);

  function reset() {
    segments = [];
    particles = [];
    targetLength = 170 + Math.floor(Math.random() * 55);
    angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.25;
    angularVelocity = 0;
    seed = Math.random() * 1000;
    finishWait = 0;
    state = STATE.READY;
    stateFrame = 0;
    button.textContent = "着火";
    button.hidden = false;
  }

  function ignite() {
    if (state === STATE.READY) {
      state = STATE.IGNITING;
      stateFrame = 0;
      button.hidden = true;
      segments.push({
        x: W / 2, y: GROUND - 7, r: 13,
        mark: Math.random() * Math.PI * 2
      });
    } else if (state === STATE.FINISH) {
      reset();
    }
  }

  button.addEventListener("click", ignite);

  function addParticles(x, y, amount) {
    for (let i = 0; i < amount; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 0.5 + Math.random() * 3.2;
      particles.push({
        type: "spark", x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 1.2,
        life: 12 + Math.random() * 15,
        maxLife: 27,
        size: 1 + Math.random() * 2.2
      });
    }
    if (Math.random() < 0.55) {
      particles.push({
        type: "smoke", x: x + (Math.random() - 0.5) * 12, y,
        vx: (Math.random() - 0.5) * 0.65,
        vy: -0.8 - Math.random() * 1.1,
        life: 35 + Math.random() * 30,
        maxLife: 65,
        size: 7 + Math.random() * 10
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.type === "spark") p.vy += 0.12;
      else {
        p.size += 0.22;
        p.vx += Math.sin(frame * 0.04 + i) * 0.015;
      }
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function update() {
    frame++;
    stateFrame++;

    if (state === STATE.TITLE && stateFrame > 125) {
      state = STATE.READY;
      stateFrame = 0;
      button.hidden = false;
    }

    if (state === STATE.IGNITING) {
      addParticles(W / 2, GROUND - 10, 3);
      if (stateFrame > 48) {
        state = STATE.GROWING;
        stateFrame = 0;
      }
    }

    if (state === STATE.GROWING) {
      const head = segments[segments.length - 1];
      addParticles(head.x, head.y, 2);

      if (frame % 2 === 0 && segments.length < targetLength) {
        const n = segments.length;
        const wobble =
          Math.sin(n * 0.19 + seed) * 0.075 +
          Math.cos(n * 0.47 - seed) * 0.055 +
          (Math.random() - 0.5) * 0.12;

        angularVelocity = angularVelocity * 0.78 + wobble;
        angle += angularVelocity;

        // 画面内に収まるよう、端と上下でゆるく向きを戻す。
        if (head.y > GROUND - 25 && Math.sin(angle) > 0) angle -= 0.15;
        if (head.y < 145 && Math.sin(angle) < 0) angle += 0.13;
        if (head.x < 145) angle += 0.12;
        if (head.x > W - 145) angle -= 0.12;

        const progress = n / targetLength;
        const step = 4.25;
        const x = head.x + Math.cos(angle) * step;
        const y = head.y + Math.sin(angle) * step;
        const lump = Math.sin(n * 0.63) * 2 + (Math.random() - 0.5) * 2.2;

        segments.push({
          x, y,
          r: Math.max(6, 13.5 * (1 - progress * 0.28) + lump),
          mark: Math.random() * Math.PI * 2
        });
      }

      if (segments.length >= targetLength) {
        finishWait++;
        if (finishWait > 115) {
          state = STATE.FINISH;
          stateFrame = 0;
          button.textContent = "もう一度";
          button.hidden = false;
        }
      }
    }

    updateParticles();
  }

  function intertitle(main, sub) {
    ctx.fillStyle = "#090909";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 3;
    ctx.strokeRect(48, 42, W - 96, H - 84);
    ctx.lineWidth = 1;
    ctx.strokeRect(57, 51, W - 114, H - 102);

    ctx.fillStyle = "#eee";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = 'bold 54px "Yu Mincho", "Hiragino Mincho ProN", serif';
    ctx.fillText(main, W / 2, H / 2 - (sub ? 25 : 0));
    if (sub) {
      ctx.fillStyle = "#aaa";
      ctx.font = '23px "Yu Mincho", "Hiragino Mincho ProN", serif';
      ctx.fillText(sub, W / 2, H / 2 + 43);
    }
  }

  function drawStage() {
    const bg = ctx.createLinearGradient(0, 0, 0, GROUND);
    bg.addColorStop(0, "#191919");
    bg.addColorStop(1, "#353535");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, GROUND);

    const floor = ctx.createLinearGradient(0, GROUND, 0, H);
    floor.addColorStop(0, "#666");
    floor.addColorStop(0.16, "#3b3b3b");
    floor.addColorStop(1, "#171717");
    ctx.fillStyle = floor;
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.strokeStyle = "#777";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(W, GROUND);
    ctx.stroke();

    // 地面の影
    ctx.fillStyle = "rgba(0,0,0,0.48)";
    ctx.beginPath();
    ctx.ellipse(W / 2, GROUND + 9, 65 + segments.length * 0.48, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // 蛇玉の種
    if (state === STATE.READY || state === STATE.IGNITING) {
      ctx.fillStyle = "#111";
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(W / 2, GROUND - 6, 16, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // 成長した炭状の本体。色は無彩色のみ。
    for (let i = 0; i < segments.length; i++) {
      const s = segments[i];
      ctx.fillStyle = i % 4 === 0 ? "#171717" : "#101010";
      ctx.beginPath();
      const spikes = 10;
      for (let k = 0; k <= spikes; k++) {
        const a = (k / spikes) * Math.PI * 2 + s.mark;
        const radius = s.r * (0.82 + Math.sin(k * 2.7 + i * 0.8) * 0.15);
        const px = s.x + Math.cos(a) * radius;
        const py = s.y + Math.sin(a) * radius;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = i % 3 === 0 ? "#555" : "#292929";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.62, s.mark, s.mark + 1.7);
      ctx.stroke();

      ctx.fillStyle = "#050505";
      ctx.beginPath();
      ctx.arc(
        s.x + Math.cos(s.mark) * s.r * 0.32,
        s.y + Math.sin(s.mark) * s.r * 0.32,
        s.r * 0.18, 0, Math.PI * 2
      );
      ctx.fill();
    }

    // 火花と白煙
    for (const p of particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      if (p.type === "spark") {
        ctx.fillStyle = `rgba(245,245,245,${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = `rgba(220,220,220,${alpha * 0.22})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (state === STATE.READY) {
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.textAlign = "center";
      ctx.font = '20px "Yu Mincho", serif';
      ctx.fillText("火をつけるべし", W / 2, 110);
    }
  }

  function filmEffects() {
    // フィルム粒子
    const ox = Math.floor(Math.random() * 128);
    const oy = Math.floor(Math.random() * 128);
    ctx.save();
    ctx.globalAlpha = 0.42;
    for (let x = -ox; x < W; x += 256) {
      for (let y = -oy; y < H; y += 256) {
        ctx.drawImage(grain, x, y);
      }
    }
    ctx.restore();

    // 縦傷
    if (Math.random() < 0.38) {
      const x = Math.random() * W;
      ctx.strokeStyle = Math.random() < 0.5
        ? "rgba(255,255,255,0.18)"
        : "rgba(0,0,0,0.32)";
      ctx.lineWidth = 0.7 + Math.random();
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + (Math.random() - 0.5) * 3, H);
      ctx.stroke();
    }

    // 映写機の明滅
    const flicker = Math.sin(frame * 0.63) * 0.025 + (Math.random() - 0.5) * 0.045;
    if (flicker > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flicker})`;
    } else {
      ctx.fillStyle = `rgba(0,0,0,${-flicker})`;
    }
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    ctx.save();
    // フィルムの微細な縦揺れ
    ctx.translate((Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 1.3);

    if (state === STATE.TITLE) {
      intertitle("蛇玉キネマ", "昭和初期・無声映画風");
    } else if (state === STATE.FINISH) {
      intertitle("完", "");
    } else {
      drawStage();
    }

    ctx.restore();
    filmEffects();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
