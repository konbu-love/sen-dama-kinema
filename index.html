<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080808">
  <title>蛇玉キネマ</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #080808;
      color: #e6e6e6;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
    }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 0;
      overflow: hidden;
      filter: grayscale(100%) contrast(118%);
    }
    #theater-wrapper {
      position: relative;
      width: min(94vw, 640px);
      aspect-ratio: 4 / 3;
      background: #111;
      border: 10px solid #000;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(255,255,255,.08), inset 0 0 30px #000;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, transparent 52%, rgba(0,0,0,.88) 100%);
    }
    #controls {
      margin-top: 20px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #ignite-btn {
      background: #141414;
      color: #f0f0f0;
      border: 2px solid #dcdcdc;
      padding: 11px 42px;
      font-size: 1.3rem;
      font-family: inherit;
      letter-spacing: .35em;
      text-indent: .35em;
      cursor: pointer;
      box-shadow: 0 0 0 3px #141414, 0 0 0 4px #777;
      transition: transform .1s, background-color .2s, opacity .4s;
    }
    #ignite-btn:active { transform: scale(.96); background: #2b2b2b; }
    #ignite-btn:disabled { cursor: default; opacity: .65; }
    #ignite-btn.hidden { opacity: 0; pointer-events: none; }
    #caption-note {
      margin-top: 10px;
      padding: 0 12px;
      color: #777;
      font-size: .75rem;
      letter-spacing: .1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main id="theater-wrapper" aria-label="蛇玉キネマ">
    <canvas id="screen" width="800" height="600"></canvas>
    <div id="vignette"></div>
  </main>
  <div id="controls">
    <button id="ignite-btn" type="button">着火</button>
  </div>
  <p id="caption-note">画面内の演出です。実際の火薬は使用しません。</p>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d');
      const igniteBtn = document.getElementById('ignite-btn');
      if (!ctx) return;

      const W = canvas.width;
      const H = canvas.height;
      const GROUND_Y = 470;
      const ADMIRING_FRAMES = 270; // 約4.5秒（60fps想定）
      const STATES = {
        TITLE: 'TITLE_CARD', IDLE: 'IDLE', IGNITING: 'IGNITING',
        GROWING: 'GROWING', ADMIRING: 'ADMIRING', FIN: 'FIN_CARD'
      };

      let state = STATES.TITLE;
      let stateTimer = 0;
      let frameCount = 0;
      let segments = [];
      let particles = [];
      let maxSegments = 180;
      let growthAngle = -Math.PI / 2;
      let angularVel = 0;
      let targetBias = 0;
      let seedFactor = Math.random() * 1000;

      // 映写機の粒子を作るための小さな白黒画像
      const grainCanvas = document.createElement('canvas');
      grainCanvas.width = 256;
      grainCanvas.height = 256;
      const grainCtx = grainCanvas.getContext('2d');
      const grainImage = grainCtx.createImageData(256, 256);
      for (let i = 0; i < grainImage.data.length; i += 4) {
        const value = Math.random() * 255;
        grainImage.data[i] = value;
        grainImage.data[i + 1] = value;
        grainImage.data[i + 2] = value;
        grainImage.data[i + 3] = 28;
      }
      grainCtx.putImageData(grainImage, 0, 0);

      function resetFilm() {
        segments = [];
        particles = [];
        maxSegments = Math.floor(155 + Math.random() * 85);
        growthAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.35;
        angularVel = 0;
        targetBias = (Math.random() - 0.5) * 0.045;
        seedFactor = Math.random() * 1000;
        state = STATES.IDLE;
        stateTimer = 0;
        igniteBtn.textContent = '着火';
        igniteBtn.disabled = false;
        igniteBtn.classList.remove('hidden');
      }

      igniteBtn.addEventListener('click', () => {
        if (state === STATES.IDLE) {
          state = STATES.IGNITING;
          stateTimer = 0;
          igniteBtn.classList.add('hidden');
          segments.push({
            x: W / 2, y: GROUND_Y - 6, r: 13,
            charMark: Math.random() * Math.PI * 2,
            ashTone: Math.random()
          });
        } else if (state === STATES.FIN) {
          resetFilm();
        }
      });

      function spawnFireAndSmoke(x, y, sparkCount, smokeProbability) {
        for (let i = 0; i < sparkCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 4.5;
          particles.push({
            type: 'spark',
            x: x + (Math.random() - 0.5) * 14,
            y: y + (Math.random() - 0.5) * 14,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            life: 10 + Math.random() * 16,
            maxLife: 26,
            size: 1.5 + Math.random() * 2.5
          });
        }
        if (Math.random() < smokeProbability) {
          particles.push({
            type: 'smoke',
            x: x + (Math.random() - 0.5) * 20,
            y: y - 6,
            vx: (Math.random() - 0.5) * 0.8,
            vy: -1.1 - Math.random() * 1.4,
            life: 50 + Math.random() * 40,
            maxLife: 90,
            size: 10 + Math.random() * 16
          });
        }
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.type === 'spark') {
            p.vy += 0.15;
          } else {
            p.size += 0.26;
            p.vx += Math.sin(frameCount * 0.05 + i) * 0.03;
          }
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function update() {
        frameCount++;
        stateTimer++;

        if (state === STATES.TITLE) {
          if (stateTimer > 120) {
            state = STATES.IDLE;
            stateTimer = 0;
          }
          return;
        }

        if (state === STATES.IGNITING) {
          spawnFireAndSmoke(W / 2, GROUND_Y - 10, 4, 0.7);
          if (stateTimer > 42) {
            state = STATES.GROWING;
            stateTimer = 0;
          }
        } else if (state === STATES.GROWING) {
          const head = segments[segments.length - 1];
          if (head) spawnFireAndSmoke(head.x, head.y, 2, 0.65);

          if (head && frameCount % 2 === 0 && segments.length < maxSegments) {
            const progress = segments.length / maxSegments;
            const noise = Math.sin(segments.length * 0.24 + seedFactor) * 0.09
              + Math.cos(segments.length * 0.57 - seedFactor) * 0.07
              + (Math.random() - 0.5) * 0.15;

            angularVel = angularVel * 0.76 + noise + targetBias;
            growthAngle += angularVel;
            if (head.y > GROUND_Y - 18 && Math.sin(growthAngle) > 0) growthAngle -= 0.17;
            if (head.y < 130 && Math.sin(growthAngle) < 0) growthAngle += 0.15;
            if (head.x < 165) growthAngle += 0.13;
            if (head.x > W - 165) growthAngle -= 0.13;

            const step = 4.6;
            const nextX = head.x + Math.cos(growthAngle) * step;
            const nextY = head.y + Math.sin(growthAngle) * step;
            const baseRadius = 13.5 * (1 - progress * 0.36);
            const bump = Math.sin(segments.length * 0.75) * 2.4 + (Math.random() - 0.5) * 2.8;

            segments.push({
              x: nextX, y: nextY,
              r: Math.max(6.2, baseRadius + bump),
              charMark: Math.random() * Math.PI * 2,
              ashTone: Math.random()
            });
          }

          if (segments.length >= maxSegments) {
            state = STATES.ADMIRING;
            stateTimer = 0;
            igniteBtn.textContent = '鑑賞中…';
            igniteBtn.disabled = true;
            igniteBtn.classList.remove('hidden');
          }
        } else if (state === STATES.ADMIRING) {
          const head = segments[segments.length - 1];
          if (head) spawnFireAndSmoke(head.x, head.y, 0, 0.35);
          if (stateTimer > ADMIRING_FRAMES) {
            state = STATES.FIN;
            stateTimer = 0;
            igniteBtn.textContent = 'もう一度';
            igniteBtn.disabled = false;
          }
        }

        updateParticles();
      }

      function drawIntertitle(mainText, subText) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = '#dcdcdc';
        ctx.lineWidth = 3;
        ctx.strokeRect(48, 42, W - 96, H - 84);
        ctx.lineWidth = 1;
        ctx.strokeRect(56, 50, W - 112, H - 100);

        const corners = [
          [48, 42], [W - 48, 42], [48, H - 42], [W - 48, H - 42]
        ];
        ctx.fillStyle = '#dcdcdc';
        corners.forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#efefef';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (subText) {
          ctx.font = 'bold 52px "Hiragino Mincho ProN", "Yu Mincho", serif';
          ctx.fillText(mainText, W / 2, H / 2 - 26);
          ctx.font = '22px "Hiragino Mincho ProN", "Yu Mincho", serif';
          ctx.fillStyle = '#b8b8b8';
          ctx.fillText(subText, W / 2, H / 2 + 44);
        } else {
          ctx.font = 'bold 96px "Hiragino Mincho ProN", "Yu Mincho", serif';
          ctx.fillText(mainText, W / 2, H / 2);
        }
      }

      function drawStage() {
        const background = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        background.addColorStop(0, '#1c1c1c');
        background.addColorStop(1, '#363636');
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, W, GROUND_Y);

        const ground = ctx.createLinearGradient(0, GROUND_Y, 0, H);
        ground.addColorStop(0, '#5a5a5a');
        ground.addColorStop(0.15, '#3b3b3b');
        ground.addColorStop(1, '#181818');
        ctx.fillStyle = ground;
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        ctx.strokeStyle = '#7a7a7a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(W, GROUND_Y);
        ctx.stroke();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.beginPath();
        ctx.ellipse(W / 2, GROUND_Y + 8, 95 + segments.length * 0.45, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // 蛇玉本体：多孔質でギザギザした灰と炭の質感
        for (let i = 0; i < segments.length; i++) {
          const s = segments[i];
          ctx.fillStyle = s.ashTone > 0.7 ? '#242424' : '#111111';
          ctx.beginPath();
          const spikes = 7;
          for (let k = 0; k <= spikes; k++) {
            const angle = (k / spikes) * Math.PI * 2 + s.charMark;
            const radius = s.r * (0.78 + Math.sin(k * 4 + i * 1.7) * 0.26);
            const px = s.x + Math.cos(angle) * radius;
            const py = s.y + Math.sin(angle) * radius;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = i % 2 === 0 ? '#686868' : '#383838';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(
            s.x + Math.cos(s.charMark) * (s.r * 0.7),
            s.y + Math.sin(s.charMark) * (s.r * 0.7)
          );
          ctx.lineTo(
            s.x + Math.cos(s.charMark + 1.2) * (s.r * 0.85),
            s.y + Math.sin(s.charMark + 1.2) * (s.r * 0.85)
          );
          ctx.stroke();

          ctx.fillStyle = '#040404';
          ctx.beginPath();
          ctx.arc(
            s.x + Math.cos(s.charMark) * (s.r * 0.35),
            s.y + Math.sin(s.charMark) * (s.r * 0.35),
            s.r * 0.24, 0, Math.PI * 2
          );
          ctx.fill();
        }

        if (state === STATES.IDLE || state === STATES.IGNITING) {
          ctx.fillStyle = '#0d0d0d';
          ctx.strokeStyle = '#666';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(W / 2, GROUND_Y - 5, 16, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        particles.forEach(p => {
          const alpha = Math.max(0, p.life / p.maxLife);
          if (p.type === 'spark') {
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          } else {
            ctx.fillStyle = `rgba(220, 220, 220, ${alpha * 0.28})`;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function applyFilmEffects() {
        const offsetX = Math.floor(Math.random() * 128);
        const offsetY = Math.floor(Math.random() * 128);
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        for (let x = -offsetX; x < W; x += 256) {
          for (let y = -offsetY; y < H; y += 256) {
            ctx.drawImage(grainCanvas, x, y);
          }
        }
        ctx.restore();

        if (Math.random() < 0.45) {
          const scratchCount = Math.floor(1 + Math.random() * 3);
          for (let i = 0; i < scratchCount; i++) {
            const x = Math.random() * W;
            ctx.strokeStyle = Math.random() < 0.6
              ? 'rgba(255, 255, 255, 0.22)'
              : 'rgba(0, 0, 0, 0.35)';
            ctx.lineWidth = 0.6 + Math.random() * 1.1;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + (Math.random() - 0.5) * 4, H);
            ctx.stroke();
          }
        }

        if (Math.random() < 0.28) {
          const x = Math.random() * W;
          const y = Math.random() * H;
          ctx.strokeStyle = 'rgba(20, 20, 20, 0.55)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x, y, 3 + Math.random() * 8, 0, Math.PI * (0.5 + Math.random()));
          ctx.stroke();
        }

        const flicker = Math.sin(frameCount * 0.7) * 0.04 + (Math.random() - 0.5) * 0.09;
        if (flicker > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flicker})`;
        } else {
          ctx.fillStyle = `rgba(0, 0, 0, ${-flicker})`;
        }
        ctx.fillRect(0, 0, W, H);
      }

      function loop() {
        update();
        ctx.save();
        const jitterY = (Math.random() - 0.5) * 1.6;
        const jitterX = (Math.random() - 0.5) * 0.6;
        ctx.translate(jitterX, jitterY);

        if (state === STATES.TITLE) {
          drawIntertitle('蛇玉キネマ', '昭和初期無声映画風');
        } else if (state === STATES.FIN) {
          drawIntertitle('完', '');
        } else {
          drawStage();
        }
        ctx.restore();
        applyFilmEffects();
        requestAnimationFrame(loop);
      }

      loop();
    })();
  </script>
</body>
</html>
